name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: moto_test
          POSTGRES_USER: moto
          POSTGRES_PASSWORD: moto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moto -d moto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost
      DB_NAME: moto_test
      DB_USER: moto
      DB_PASSWORD: moto
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier la configuration Django
        run: python manage.py check

      - name: Vérifier que les migrations sont à jour
        run: python manage.py makemigrations --check --dry-run

      - name: Lancer les tests
        run: python manage.py test
